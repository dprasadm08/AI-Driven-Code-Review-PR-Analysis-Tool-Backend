server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-pr-review-backend
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/ai-pr-review
      auto-index-creation: true
  
  security:
    user:
      name: admin
      password: admin123

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000  # 24 hours in milliseconds
  
  github:
    api:
      base-url: https://api.github.com
      token: ${GITHUB_TOKEN:}  # Set via environment variable or here
      timeout: 30000  # 30 seconds
      per-page: 30  # Results per page
    webhook:
      secret: ${GITHUB_WEBHOOK_SECRET:}  # GitHub webhook secret for signature validation
      analysis:
        enabled: ${WEBHOOK_ANALYSIS_ENABLED:true}  # Auto-trigger analysis on webhook events
        provider: ${WEBHOOK_ANALYSIS_PROVIDER:openai}  # Which AI provider to use
        include-diff: ${WEBHOOK_ANALYSIS_INCLUDE_DIFF:false}  # Include full diff in auto-triggered analysis
        trigger-actions: opened,synchronize  # Comma-separated actions that trigger analysis
  
  ai:
    provider: ${AI_PROVIDER:openai}

    prompt:
      max-tokens: 7000
      reserved-output-tokens: 1000

    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4
      base-url: https://api.openai.com/v1
      max-tokens: 1000
      temperature: 0.2
      timeout-seconds: 60
      connect-timeout-millis: ${OPENAI_CONNECT_TIMEOUT_MS:10000}
      read-timeout-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:60}
      write-timeout-seconds: ${OPENAI_WRITE_TIMEOUT_SECONDS:60}
      retry-attempts: ${OPENAI_RETRY_ATTEMPTS:2}
      retry-backoff-millis: ${OPENAI_RETRY_BACKOFF_MS:1000}
      retry-max-backoff-millis: ${OPENAI_RETRY_MAX_BACKOFF_MS:8000}
    
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: claude-3-5-sonnet-20241022
      base-url: https://api.anthropic.com/v1
      max-tokens: 1000
      temperature: 0.2
      timeout-seconds: 60
      anthropic-version: 2023-06-01
      connect-timeout-millis: ${CLAUDE_CONNECT_TIMEOUT_MS:10000}
      read-timeout-seconds: ${CLAUDE_READ_TIMEOUT_SECONDS:60}
      write-timeout-seconds: ${CLAUDE_WRITE_TIMEOUT_SECONDS:60}
      retry-attempts: ${CLAUDE_RETRY_ATTEMPTS:2}
      retry-backoff-millis: ${CLAUDE_RETRY_BACKOFF_MS:1000}
      retry-max-backoff-millis: ${CLAUDE_RETRY_MAX_BACKOFF_MS:8000}

logging:
  level:
    root: INFO
    com.aiprreview: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
