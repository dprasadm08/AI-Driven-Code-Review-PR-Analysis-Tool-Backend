server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-pr-review-backend
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/ai-pr-review
      auto-index-creation: true
  
  security:
    user:
      name: admin
      password: admin123

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000  # 24 hours in milliseconds
  
  github:
    api:
      base-url: https://api.github.com
      token: ${GITHUB_TOKEN:}  # Set via environment variable or here
      timeout: 30000  # 30 seconds
      per-page: 30  # Results per page
    webhook:
      secret: ${GITHUB_WEBHOOK_SECRET:}  # GitHub webhook secret for signature validation
  
  ai:
    prompt:
      max-tokens: 7000
      reserved-output-tokens: 1000

    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4
      base-url: https://api.openai.com/v1
      max-tokens: 1000
      temperature: 0.2
      timeout-seconds: 60
    
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: claude-3-5-sonnet-20241022
      base-url: https://api.anthropic.com/v1

logging:
  level:
    root: INFO
    com.aiprreview: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
